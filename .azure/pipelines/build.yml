# just wait for PR to run on main as a tirgger
pr: none
trigger: none

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.30.0
#  pipelines:
#    - pipeline: pr
#      source: PR
#      trigger:
#        branches:
#          include:
#            - main

extends:
  template: stages/wrapper_ci.yml@templates
  parameters:
    gitFetchDepth: 0
    globalVariables:
      - template: .azure/pipelines/variables.yml@self
    validationJobs:
      - name: Docker Build PHP
        steps:
          - template: ../steps/azure_web_app_docker_build_push.yml@templates
            parameters:
              azurecrName: $(azurecrName)
              dockerfilePath: $(Build.SourcesDirectory)/docker/DockerfilePHP
              repository: libraryservice/php
              buildArgs:
                - GIT_SHA=$(Build.SourceVersion)
      - name: Docker Build Crond
        steps:
          - template: ../steps/azure_web_app_docker_build_push.yml@templates
            parameters:
              azurecrName: $(azurecrName)
              dockerfilePath: $(Build.SourcesDirectory)/docker/DockerfileCrond
              repository: libraryservice/crond
              buildArgs:
                - GIT_SHA=$(Build.SourceVersion)
      - name: Docker Build Tika
        steps:
          - template: ../steps/azure_web_app_docker_build_push.yml@templates
            parameters:
              azurecrName: $(azurecrName)
              dockerfilePath: $(Build.SourcesDirectory)/docker/DockerfileTika
              repository: libraryservice/tika
              buildArgs:
                - GIT_SHA=$(Build.SourceVersion)


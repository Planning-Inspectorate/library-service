services:
  pins_search_azure.index_builder_decorator:
    class: Drupal\pins_search_azure\Services\PinsAzureIndexBuilder
    decorates: search_api_aais.index_builder 
    arguments: 
      - '@pins_search_azure.index_builder_decorator.inner'
      - '@config.factory'
      - '@logger.factory'
  pins_search_azure.vectorizer:
    class: Drupal\pins_search_azure\Services\AzureVectorizer
    arguments: ['@http_client', '@config.factory', '@logger.factory']

  pins_search_azure.token_usage_tracker:
    class: Drupal\pins_search_azure\Services\TokenUsageTracker
    arguments: ['@database', '@logger.factory']

  pins_search_azure.query_param_builder_decorator:
    class: Drupal\pins_search_azure\Services\PinsAzureQueryParamBuilder
    decorates: search_api_aais.query_param_builder 
    arguments: 
      - '@pins_search_azure.query_param_builder_decorator.inner'
      - '@pins_search_azure.vectorizer'
      - '@logger.factory'
      - '@config.factory'
      - '@pins_search_azure.token_usage_tracker'

  pins_search_azure.search_identity_credential:
    class: Drupal\pins_search_azure\Services\SearchIdentityCredential
    arguments: ['@http_client']

  pins_search_azure.identity_backend_client_factory:
    parent: search_api_aais.aais_backend_client_factory
    class: Drupal\pins_search_azure\Services\IdentityBackendClientFactory
    calls:
      - [setCredential, ['@pins_search_azure.search_identity_credential']]

framework:
  version: 1.x
  css:
    theme:
      'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css': { type: external }
      css/style.css: {}
      css/govuk_pins.css: {}
  js:
    # govuk-frontend must load before the inline window.GOVUKFrontend.initAll()
    # call in html.html.twig. Kept in sync with the parent theme's installed
    # version via the gulp 'assets' task.
    js/all.bundle.js: { minified: true, weight: -10 }
    js/govuk_pins.js: {}
  dependencies:
    - core/jquery
    - core/once
    - core/drupal

webform:
  version: 1.x
  js:
    js/webform.js: {}
  dependencies:
    - core/jquery
    - core/once
    - core/drupal
